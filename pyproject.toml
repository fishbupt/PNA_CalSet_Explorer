[project]
name = "pna-calset-explorer"
version = "0.1.1"
description = "PyQt6 utility for inspecting and dumping Keysight PNA/PNA-X CalSets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyqt6>=6.7",
    "pyqtgraph>=0.13.7",
    "pyvisa>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
